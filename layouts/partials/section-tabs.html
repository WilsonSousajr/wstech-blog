{{- /* All · Engineering · Off-topic. Plain links (crawlable, no JS); the current one gets aria-current. */ -}}
{{- $cur := . -}}
<nav class="tabs" aria-label="{{ i18n "tabsLabel" }}">
  <a class="tab" href="{{ site.Home.RelPermalink }}"{{ if $cur.IsHome }} aria-current="page"{{ end }}>{{ i18n "tabAll" }}</a>
  {{- range site.Params.sections }}
    {{- with site.GetPage . }}
  <a class="tab" href="{{ .RelPermalink }}"{{ if eq .RelPermalink $cur.RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
    {{- end }}
  {{- end }}
</nav>
