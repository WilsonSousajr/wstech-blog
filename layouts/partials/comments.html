{{- /* giscus (GitHub Discussions). Renders nothing until params.giscus.repoId/categoryId are set.
       theme.js injects the client with the current theme and keeps it in sync on toggle. */ -}}
{{- with site.Params.giscus }}{{ if and .repoId .categoryId }}
<section class="comments" aria-label="{{ i18n "comments" }}">
  <h2 class="section-heading">{{ i18n "comments" }}</h2>
  <div id="giscus" class="giscus"
       data-repo="{{ .repo }}"
       data-repo-id="{{ .repoId }}"
       data-category="{{ .category }}"
       data-category-id="{{ .categoryId }}"
       data-mapping="pathname"
       data-strict="1"
       data-reactions-enabled="1"
       data-emit-metadata="0"
       data-input-position="top"
       data-lang="{{ if eq site.Language.Lang "pt-br" }}pt{{ else }}en{{ end }}"
       data-loading="lazy"></div>
</section>
{{ end }}{{ end -}}
